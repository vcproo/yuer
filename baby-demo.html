<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小芽 · 慢慢长大</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#384a40;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft Yahei",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #b08960;outline-offset:5px}.app{max-width:1120px;margin:auto;padding:36px 48px 24px}.brand{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e4e5da;padding-bottom:23px}.logo{font-size:22px;letter-spacing:3px;font-weight:650}.logo span{display:inline-flex;align-items:center;justify-content:center;background:#dfe8d8;border-radius:14px;width:38px;height:38px;margin-right:12px;letter-spacing:0}.edition{font-size:11px;letter-spacing:3px;color:#8c9587}.layout{display:grid;grid-template-columns:1fr 350px;gap:68px;align-items:center;margin-top:36px}.eyebrow{font-size:11px;letter-spacing:3px;color:#8c977e}.intro h1{font-size:36px;line-height:1.45;font-weight:500;margin:12px 0 8px;letter-spacing:2px}.intro p{font-size:13px;color:#8a9183;line-height:1.9;margin:0}.stage{position:relative;margin-top:20px;background:#f0f1e7;border:1px solid #e5e8dc;border-radius:160px 160px 26px 26px;overflow:hidden}.stage canvas{width:100%;height:420px;display:block;touch-action:pan-y}.pill{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:11px;background:#ffffffb5;padding:8px 14px;border-radius:20px;white-space:nowrap;color:#788a70}.pill:before{content:'●';color:#8aa27d;margin-right:7px}.hint{text-align:center;font-size:12px;color:#939c87;margin:14px 0}.panel{padding-top:32px}.caption{font-size:11px;letter-spacing:2px;color:#98a08e}.name-row{display:flex;align-items:center;justify-content:space-between;margin:12px 0 22px}.name{font-size:27px;font-weight:500;letter-spacing:2px}.day{font-size:11px;color:#88957d;background:#eaf0e1;padding:7px 11px;border-radius:20px}.message{font-size:14px;line-height:1.8;padding:19px 20px;background:#fffdf8;border:1px solid #ece9df;border-radius:4px 20px 20px 20px;min-height:65px;color:#718365;margin-bottom:27px}.stat{display:grid;grid-template-columns:54px 1fr 34px;align-items:center;gap:12px;font-size:12px;margin:17px 0;color:#86907e}.track{height:5px;background:#e7e8dd;border-radius:6px;overflow:hidden}.fill{height:100%;border-radius:6px;background:#a5b899;transition:width .5s}.stat:nth-child(2) .fill{background:#d7af95}.stat:nth-child(3) .fill{background:#d6c28e}.value{text-align:right;font-variant-numeric:tabular-nums}.divider{height:1px;background:#e3e5d9;margin:28px 0}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.action{border:1px solid #e3e6d9;background:#fffdf8;color:#63765c;border-radius:17px;padding:17px 4px;font-size:12px;transition:transform .2s,background .2s}.action:hover:not(:disabled){transform:translateY(-3px);background:#eaf0e1}.action:disabled{opacity:.45;cursor:default}.icon{display:block;font-size:25px;margin-bottom:10px}.note{margin-top:22px;font-size:11px;line-height:1.9;color:#a0a592}.footer{display:flex;justify-content:space-between;font-size:10px;color:#a0a594;letter-spacing:1px;margin-top:38px;padding-top:20px;border-top:1px solid #e4e5da}.save-warning{color:#b17c62}.sleeping .stage{background:#e5eae2}.sleeping .pill:before{color:#8192a1}@media(max-width:760px){.app{padding:22px 22px}.edition{font-size:9px;letter-spacing:1px}.layout{grid-template-columns:1fr;gap:0;margin-top:24px}.intro h1{font-size:27px}.intro p{font-size:12px}.stage{max-width:440px;margin:20px auto 0}.stage canvas{height:350px}.panel{padding-top:14px}.caption{display:none}.name-row{margin-top:0;margin-bottom:12px}.message{margin-bottom:17px}.divider{margin:20px 0}.footer{margin-top:24px}.note{margin-top:15px}.hint{margin-bottom:0}}
</style></head>
<body><main class="app"><header class="brand"><div class="logo"><span>芽</span>小芽</div><div class="edition">A LITTLE LIFE, A LOT OF LOVE</div></header>
<div class="layout"><section class="intro"><div class="eyebrow">YOUR LITTLE EVERYDAY</div><h1>陪你，把日子慢慢长大。</h1><p>一点点陪伴，一点点成长。<br>今天，也有一个小小的人在等你。</p><div class="stage"><div class="pill" id="status">今日份的小美好</div><canvas id="baby" aria-label="小芽，轻触宝宝可以抚摸；也可使用右侧按钮"></canvas></div><p class="hint">轻轻摸摸宝宝，看看 TA 的回应</p></section>
<section class="panel"><div class="caption">OUR LITTLE SPROUT</div><div class="name-row"><span class="name">小芽</span><span class="day" id="day"></span></div><div class="message" role="status" aria-live="polite" id="message"></div><div id="stats"></div><div class="divider"></div><div class="actions"><button class="action" data-act="pet"><span class="icon">♡</span>摸摸头</button><button class="action" data-act="feed"><span class="icon">♧</span>喂奶</button><button class="action" data-act="sleep"><span class="icon">☾</span><span id="sleep-label">哄睡</span></button></div><p class="note">不必着急，成长有自己的节奏。<br><span id="save-note">成长已保存在这台设备，下次见面继续陪伴。</span></p></section></div><footer class="footer"><span>小小的你，大大的世界。</span><span>2D 互动体验 · 本地存档</span></footer></main>
<script src="miniprogram/core/baby.js"></script><script>
const key='little-sprout-v1';let saved;try{saved=JSON.parse(localStorage.getItem(key))}catch(e){}
const care=new BabyKit.Care(saved),canvas=document.getElementById('baby');
const renderer=new BabyKit.Renderer(canvas,canvas.getContext('2d'),canvas.clientWidth,canvas.clientHeight,devicePixelRatio,matchMedia('(prefers-reduced-motion: reduce)').matches);
const stats=document.getElementById('stats');stats.innerHTML=[['food','饱腹'],['mood','心情'],['energy','精力']].map(([key,label])=>`<div class="stat"><span>${label}</span><div class="track"><div class="fill" id="${key}-bar"></div></div><span class="value" id="${key}-value"></span></div>`).join('');
function refresh(){const v=care.view();document.body.classList.toggle('sleeping',v.sleeping);document.getElementById('day').textContent=`陪伴第 ${v.day} 天`;document.getElementById('message').textContent=v.message;document.getElementById('status').textContent=v.sleeping?'进入甜甜的梦乡':'今日份的小美好';document.getElementById('sleep-label').textContent=v.sleeping?'轻轻唤醒':'哄睡';for(const k of ['food','mood','energy']){document.getElementById(k+'-bar').style.width=v[k]+'%';document.getElementById(k+'-value').textContent=v[k]}document.querySelectorAll('[data-act]').forEach(b=>b.disabled=b.dataset.act==='sleep'?v.busy:(v.sleeping||v.busy));}
function save(){try{localStorage.setItem(key,JSON.stringify(care.save()))}catch(e){document.getElementById('save-note').textContent='当前浏览器无法保存，离开后进度可能丢失。';document.getElementById('save-note').className='save-warning'}}
function act(type){if(care.act(type)){refresh();save()}}
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act)));
canvas.addEventListener('pointermove',e=>renderer.point(e.clientX-canvas.getBoundingClientRect().left));canvas.addEventListener('pointerleave',()=>renderer.point(canvas.clientWidth/2));
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect(),scale=Math.min(r.width/420,r.height/440),x=(e.clientX-r.left-r.width/2)/scale,y=(e.clientY-r.top-r.height/2)/scale;if(Math.abs(x)<95&&y>-120&&y<125)act('pet')});
let frame,lastUI=0,lastSave=0;function loop(t){care.tick(Date.now());renderer.draw(t,care.view());if(t-lastUI>250){refresh();lastUI=t}if(t-lastSave>5000){save();lastSave=t}frame=requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(frame);if(document.hidden){care.tick(Date.now());save()}else{care.tick(Date.now());renderer.resetClock();refresh();frame=requestAnimationFrame(loop)}});
window.addEventListener('pagehide',save);new ResizeObserver(()=>renderer.resize(canvas.clientWidth,canvas.clientHeight,devicePixelRatio)).observe(canvas);refresh();save();frame=requestAnimationFrame(loop);
</script></body></html>
